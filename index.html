<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Izzy's Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-panels">
      <header class="hero hero--full">
        <div class="hero__panel-box hero__logo-panel">
          <div class="hero__brand">
            <img class="hero__logo hero__logo--compact" src="logo.png" alt="Izzy's Library App logo" />
          </div>
        </div>
      </header>

      <div class="hero__panel-box hero__stats-panel">
        <div class="hero__stats" id="stats"></div>
      </div>

      <div class="controls-wrap">
        <section class="controls">
          <label class="search">
            <span>Search titles</span>
            <input type="search" id="searchInput" placeholder="Type a title" />
          </label>

          <label class="sort">
            <span>Sort by</span>
            <select id="sortSelect">
              <option value="order">Series order</option>
              <option value="progress">Progress</option>
              <option value="title">Title</option>
              <option value="pages">Pages read</option>
            </select>
          </label>

          <label class="tag-filter">
            <span>Filter by tag</span>
            <select id="tagFilter">
              <option value="all">All tags</option>
            </select>
          </label>

          <div class="filters" id="statusFilters" role="group" aria-label="Filter books">
            <button class="filter active" data-status="all">All</button>
            <button class="filter" data-status="reading">Reading</button>
            <button class="filter" data-status="finished">Finished</button>
            <button class="filter" data-status="unstarted">Unstarted</button>
            <button class="filter" data-status="unknown">Unknown</button>
          </div>
        </section>

      </div>
    </div>

    <main>

      <section class="shelf">
        <div class="section-header">
          <h2>Books I Have</h2>
          <p id="resultsCount"></p>
        </div>
        <div class="book-grid" id="bookGrid"></div>
      </section>

      <section class="missing">
        <div class="section-header">
          <h2>Books I Don't Have</h2>
          <p>Add titles to remember what to find next.</p>
        </div>
        <div class="missing-list" id="missingList"></div>
      </section>

    </main>

    <footer>
      <p>❤️ Made with love by Isabelle and Dad ❤️</p>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
